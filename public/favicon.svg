<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#020617" />
    </radialGradient>
    <linearGradient id="goldRim" x1="0" y1="0" x2="64" y2="64" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="50%" stop-color="#F59E0B" />
      <stop offset="100%" stop-color="#B45309" />
    </linearGradient>
    <linearGradient id="sweep" x1="32" y1="32" x2="49" y2="15" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F59E0B" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#FBBF24" stop-opacity="0.38" />
    </linearGradient>
  </defs>

  <!-- Obsidian Rounded Badge Background -->
  <rect x="2" y="2" width="60" height="60" rx="14" fill="url(#bgGlow)" stroke="url(#goldRim)" stroke-width="2.5" />
  <rect x="6" y="6" width="52" height="52" rx="10" stroke="#F59E0B" stroke-opacity="0.22" stroke-width="1" />

  <!-- Radar Sector Sweep -->
  <path d="M32 32 L32 10 A22 22 0 0 1 48.5 17.5 Z" fill="url(#sweep)" />

  <!-- Outer Astrolabe Ring -->
  <circle cx="32" cy="32" r="22" stroke="url(#goldRim)" stroke-width="2.2" />

  <!-- Mid & Inner Range Rings -->
  <circle cx="32" cy="32" r="14.5" stroke="#FBBF24" stroke-opacity="0.65" stroke-width="1.3" stroke-dasharray="3.5 2.5" />
  <circle cx="32" cy="32" r="7.5" stroke="#FDE68A" stroke-opacity="0.45" stroke-width="1.1" />

  <!-- Cardinal & Intercardinal Ticks -->
  <path d="M32 6V12M32 52V58M6 32H12M52 32H58" stroke="#FDE68A" stroke-width="2.2" stroke-linecap="round" />
  <path d="M14.3 14.3L17.8 17.8M46.2 46.2L49.7 49.7M49.7 14.3L46.2 17.8M17.8 46.2L14.3 49.7" stroke="#F59E0B" stroke-opacity="0.7" stroke-width="1.5" stroke-linecap="round" />

  <!-- Radar Sweep Needle -->
  <path d="M32 32L47.5 16.5" stroke="#FEF3C7" stroke-width="2.6" stroke-linecap="round" />

  <!-- Discovered Long-Tail Target Blips -->
  <circle cx="45.5" cy="18.5" r="3.6" fill="#10B981" stroke="#ECFDF5" stroke-width="1.4" />
  <circle cx="23" cy="24" r="2.2" fill="#FBBF24" />

  <!-- Center Pivot -->
  <circle cx="32" cy="32" r="3.8" fill="#FBBF24" stroke="#020617" stroke-width="1.5" />
</svg>
